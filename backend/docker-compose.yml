services:
  postgres:
    image: postgres:18-alpine
    container_name: ticketor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketor}
      POSTGRES_DB: ${POSTGRES_DB:-ticketor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ticketor-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketor} -d ${POSTGRES_DB:-ticketor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ticketor-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ticketor-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ticketor-pgdata:
  ticketor-redisdata: